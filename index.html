
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews Like Clockwork</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="script.js" defer></script>
</head>

<body>
    <h1>Reviews Like Clockwork</h1>
<div class="chart-container">
    <canvas id="reviewChart"></canvas>
</div>
<p class="interaction-tip">
    *Hover over each bar to see average number of reviews recorded at that hour from January 1-3, 2020.
</p>
<div class="legend">
    <span class="legend-color"></span>
    <span> Average Amazon Reviews per Hour</span>
</body>
</html>
